<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级上课考勤核对小工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #dbeafe;
            --success: #10b981;
            --success-dark: #059669;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --text-light: #9ca3af;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.12);
            --shadow-glow: 0 0 20px rgba(59, 130, 246, 0.25);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ========== 头部 ========== */
        .app-header {
            text-align: center;
            padding: 30px 20px 20px;
            position: relative;
        }
        .app-header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .app-header .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 2px;
        }
        .app-header::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), #8b5cf6);
            margin: 14px auto 0;
            border-radius: 2px;
        }

        /* ========== 上传区域 ========== */
        .upload-section {
            margin: 20px 0;
            transition: all var(--transition);
        }
        .upload-zone {
            background: var(--card-bg);
            border: 2.5px dashed var(--border);
            border-radius: var(--radius-lg);
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .upload-zone:hover {
            border-color: var(--primary);
            background: #f8faff;
            box-shadow: var(--shadow-glow);
        }
        .upload-zone.dragover {
            border-color: var(--primary);
            background: var(--primary-light);
            box-shadow: var(--shadow-glow);
            transform: scale(1.01);
        }
        .upload-zone.compact {
            padding: 16px 20px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            cursor: pointer;
            border-style: solid;
            border-color: var(--border);
            background: var(--card-bg);
        }
        .upload-zone.compact:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
            transition: transform var(--transition);
            display: inline-block;
        }
        .upload-zone:hover .upload-icon {
            transform: translateY(-4px) scale(1.1);
        }
        .upload-zone.compact .upload-icon {
            font-size: 24px;
            margin-bottom: 0;
        }
        .upload-text {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }
        .upload-zone.compact .upload-text {
            font-size: 0.9rem;
            margin-bottom: 0;
        }
        .upload-hint {
            font-size: 0.8rem;
            color: var(--text-light);
        }
        .upload-zone.compact .upload-hint {
            display: none;
        }
        .upload-zone input[type="file"] {
            display: none;
        }
        .file-name-display {
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 500;
            background: var(--primary-light);
            padding: 3px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 8px;
            animation: fadeInUp 0.3s ease;
        }

        /* ========== 统计区域 ========== */
        .stats-section {
            display: none;
            margin: 20px 0 16px;
            animation: fadeInUp 0.4s ease;
        }
        .stats-section.visible {
            display: block;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 14px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 20px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .stat-card .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
            transition: all 0.3s ease;
        }
        .stat-card.checked-stat .stat-value {
            color: var(--success);
        }
        .stat-card.rate-stat .stat-value {
            color: #8b5cf6;
        }
        .stat-card .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
            letter-spacing: 1px;
            font-weight: 500;
        }
        .stat-card .stat-icon {
            font-size: 1.2rem;
            position: absolute;
            top: 12px;
            right: 14px;
            opacity: 0.3;
        }

        /* 进度条 */
        .progress-wrapper {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px 20px;
            box-shadow: var(--shadow-sm);
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .progress-bar-bg {
            height: 8px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #8b5cf6, var(--success));
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
            position: relative;
        }
        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        /* ========== 工具栏 ========== */
        .toolbar {
            display: none;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin: 16px 0;
            animation: fadeInUp 0.4s ease;
        }
        .toolbar.visible {
            display: flex;
        }
        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-box .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            pointer-events: none;
            font-size: 1rem;
        }
        .search-box input {
            width: 100%;
            padding: 11px 16px 11px 42px;
            border: 2px solid var(--border);
            border-radius: 30px;
            font-size: 0.9rem;
            outline: none;
            background: var(--card-bg);
            transition: all var(--transition);
            font-family: inherit;
            color: var(--text);
        }
        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        .search-box input::placeholder {
            color: var(--text-light);
        }
        .search-clear {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-light);
            font-size: 1rem;
            display: none;
            background: none;
            border: none;
            padding: 2px 6px;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .search-clear:hover {
            color: var(--danger);
            background: #fee2e2;
        }
        .search-clear.visible {
            display: block;
        }

        .btn {
            padding: 11px 20px;
            border: none;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            letter-spacing: 0.5px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
        }
        .btn-success {
            background: var(--success);
            color: #fff;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover {
            background: var(--success-dark);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
        }
        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 2px solid var(--border);
            box-shadow: none;
        }
        .btn-outline:hover {
            border-color: var(--danger);
            color: var(--danger);
            background: #fef2f2;
        }
        .btn-outline-primary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            box-shadow: none;
        }
        .btn-outline-primary:hover {
            background: var(--primary-light);
            box-shadow: var(--shadow-sm);
        }
        .btn-sm {
            padding: 8px 14px;
            font-size: 0.78rem;
            border-radius: 20px;
        }

        /* ========== 名字网格 ========== */
        .names-section {
            display: none;
            animation: fadeInUp 0.5s ease;
        }
        .names-section.visible {
            display: block;
        }
        .names-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }
        .name-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
            min-height: 72px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .name-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
            transform: translateY(-3px);
            z-index: 2;
        }
        .name-card .name-index {
            font-size: 0.65rem;
            color: var(--text-light);
            font-weight: 500;
            position: absolute;
            top: 6px;
            left: 10px;
            letter-spacing: 0.5px;
            transition: color var(--transition);
        }
        .name-card .name-text {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            transition: all var(--transition);
            word-break: break-all;
            line-height: 1.3;
            margin-top: 4px;
        }
        .name-card .name-status-icon {
            font-size: 0.75rem;
            position: absolute;
            top: 6px;
            right: 8px;
            opacity: 0;
            transition: all var(--transition);
            transform: scale(0);
        }

        /* 已签到状态 */
        .name-card.checked {
            background: var(--success);
            border-color: var(--success-dark);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .name-card.checked .name-text {
            color: #ffffff;
        }
        .name-card.checked .name-index {
            color: rgba(255, 255, 255, 0.7);
        }
        .name-card.checked .name-status-icon {
            opacity: 1;
            transform: scale(1);
            color: #ffffff;
            font-weight: 700;
        }
        .name-card.checked:hover {
            border-color: var(--success-dark);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            transform: translateY(-3px);
        }

        /* 点击动画 */
        .name-card.animating-check {
            animation: popCheck 0.45s var(--bounce);
        }
        .name-card.animating-uncheck {
            animation: popUncheck 0.35s var(--bounce);
        }
        @keyframes popCheck {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(0.88);
            }
            60% {
                transform: scale(1.08);
            }
            100% {
                transform: scale(1);
            }
        }
        @keyframes popUncheck {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(0.92);
            }
            100% {
                transform: scale(1);
            }
        }

        /* 搜索变暗效果 */
        .name-card.dimmed {
            opacity: 0.15;
            pointer-events: none;
            transform: scale(0.95);
            transition: all 0.25s ease;
        }
        .name-card.highlighted {
            border-color: var(--warning);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25), var(--shadow-md);
            z-index: 3;
            animation: searchPulse 1.2s ease-in-out infinite;
        }
        .name-card.highlighted.checked {
            border-color: #ffd700;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.35), 0 4px 16px rgba(16, 185, 129, 0.35);
        }
        @keyframes searchPulse {
            0%,
            100% {
                box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25), var(--shadow-md);
            }
            50% {
                box-shadow: 0 0 0 6px rgba(245, 158, 11, 0.12), var(--shadow-md);
            }
        }

        /* 无搜索结果提示 */
        .no-result {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
            font-size: 0.95rem;
            grid-column: 1 / -1;
        }
        .no-result .no-result-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        /* ========== 动画 ========== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* ========== Toast 通知 ========== */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 14px 20px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 9999;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 350px;
            border-left: 4px solid var(--primary);
        }
        .toast.show {
            transform: translateX(0);
        }
        .toast.success {
            border-left-color: var(--success);
        }
        .toast.error {
            border-left-color: var(--danger);
        }
        .toast .toast-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            .app-header h1 {
                font-size: 1.5rem;
            }
            .app-header {
                padding: 20px 12px 14px;
            }
            .upload-zone {
                padding: 28px 18px;
            }
            .upload-icon {
                font-size: 36px;
            }
            .names-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 8px;
            }
            .name-card {
                padding: 12px 8px;
                min-height: 60px;
                border-radius: 6px;
            }
            .name-card .name-text {
                font-size: 0.85rem;
            }
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .stat-card {
                padding: 12px 10px;
            }
            .stat-card .stat-value {
                font-size: 1.6rem;
            }
            .toolbar {
                gap: 8px;
            }
            .btn {
                padding: 9px 14px;
                font-size: 0.78rem;
            }
            .toast {
                top: auto;
                bottom: 20px;
                right: 12px;
                left: 12px;
                max-width: none;
                transform: translateY(150%);
            }
            .toast.show {
                transform: translateY(0);
            }
        }
        @media (max-width: 400px) {
            .names-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 6px;
            }
            .name-card {
                padding: 10px 6px;
                min-height: 52px;
            }
            .name-card .name-text {
                font-size: 0.75rem;
            }
            .name-card .name-index {
                font-size: 0.55rem;
                top: 4px;
                left: 6px;
            }
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
            .stat-card .stat-value {
                font-size: 1.3rem;
            }
            .stat-card .stat-label {
                font-size: 0.65rem;
            }
        }

        /* ========== 导出结果弹窗 ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 9998;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .modal-overlay.visible {
            display: flex;
        }
        .modal {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 28px 24px 20px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: fadeInUp 0.3s ease;
        }
        .modal h3 {
            font-size: 1.15rem;
            margin-bottom: 16px;
            color: var(--text);
            text-align: center;
        }
        .modal .modal-close {
            float: right;
            cursor: pointer;
            font-size: 1.3rem;
            color: var(--text-light);
            background: none;
            border: none;
            padding: 4px 8px;
            border-radius: 50%;
            transition: all 0.2s;
            line-height: 1;
            margin-top: -6px;
            margin-right: -6px;
        }
        .modal .modal-close:hover {
            background: #f3f4f6;
            color: var(--text);
        }
        .modal .result-summary {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .modal .result-summary span {
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: #f9fafb;
            padding: 6px 14px;
            border-radius: 20px;
        }
        .modal .result-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 300px;
            overflow-y: auto;
            padding: 8px;
            background: #fafafa;
            border-radius: var(--radius-sm);
        }
        .modal .result-list .tag {
            font-size: 0.75rem;
            padding: 5px 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            user-select: none;
        }
        .modal .result-list .tag.checked-tag {
            background: var(--success-light);
            color: var(--success-dark);
            border: 1px solid #a7f3d0;
        }
        .modal .result-list .tag.unchecked-tag {
            background: #f3f4f6;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .modal .result-list .tag:hover {
            transform: scale(1.05);
        }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 头部 -->
        <header class="app-header">
            <h1>📋 班级上课考勤核对</h1>
            <p class="subtitle">上传Excel名单 · 点击签到 · 实时统计</p>
        </header>

        <!-- 上传区域 -->
        <div class="upload-section" id="uploadSection">
            <div class="upload-zone" id="uploadZone">
                <span class="upload-icon">📂</span>
                <div class="upload-text">点击上传或拖拽Excel文件</div>
                <div class="upload-hint">支持 .xlsx / .xls 格式，自动识别「姓名」列</div>
                <input type="file" id="fileInput" accept=".xlsx,.xls" />
            </div>
        </div>

        <!-- 统计区域 -->
        <div class="stats-section" id="statsSection">
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-icon">👥</span>
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">总人数</div>
                </div>
                <div class="stat-card checked-stat">
                    <span class="stat-icon">✅</span>
                    <div class="stat-value" id="checkedCount">0</div>
                    <div class="stat-label">已签到</div>
                </div>
                <div class="stat-card rate-stat">
                    <span class="stat-icon">📊</span>
                    <div class="stat-value" id="rateDisplay">0%</div>
                    <div class="stat-label">签到率</div>
                </div>
            </div>
            <div class="progress-wrapper">
                <div class="progress-header">
                    <span>签到进度</span>
                    <span id="progressText">0 / 0</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar" id="toolbar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索姓名快速定位..." autocomplete="off" />
                <button class="search-clear" id="searchClear" title="清空搜索">✕</button>
            </div>
            <button class="btn btn-primary btn-sm" id="btnAllCheck" title="将所有名字标记为已签到">✅ 全签</button>
            <button class="btn btn-outline btn-sm" id="btnReset" title="清除所有签到记录">🔄 重置</button>
            <button class="btn btn-outline-primary btn-sm" id="btnExport" title="导出签到结果">📥 导出</button>
            <button class="btn btn-outline btn-sm" id="btnReupload" title="重新上传名单">📂 换名单</button>
        </div>

        <!-- 名字网格 -->
        <div class="names-section" id="namesSection">
            <div class="names-grid" id="namesGrid"></div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div class="toast" id="toast">
        <span class="toast-icon" id="toastIcon">✅</span>
        <span id="toastMsg">操作成功</span>
    </div>

    <!-- 导出弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" id="modalClose">✕</button>
            <h3>📋 签到结果</h3>
            <div class="result-summary" id="resultSummary"></div>
            <div class="result-list" id="resultList"></div>
            <div class="modal-actions">
                <button class="btn btn-success btn-sm" id="btnCopyResult">📋 复制名单</button>
                <button class="btn btn-outline btn-sm" id="btnCloseModal">关闭</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ========== 状态管理 ==========
            let studentList = []; // [{name: string, checked: boolean}]
            let fileName = '';
            let searchKeyword = '';

            // ========== DOM 引用 ==========
            const uploadZone = document.getElementById('uploadZone');
            const uploadSection = document.getElementById('uploadSection');
            const fileInput = document.getElementById('fileInput');
            const statsSection = document.getElementById('statsSection');
            const toolbar = document.getElementById('toolbar');
            const namesSection = document.getElementById('namesSection');
            const namesGrid = document.getElementById('namesGrid');
            const totalCountEl = document.getElementById('totalCount');
            const checkedCountEl = document.getElementById('checkedCount');
            const rateDisplayEl = document.getElementById('rateDisplay');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const searchInput = document.getElementById('searchInput');
            const searchClear = document.getElementById('searchClear');
            const btnAllCheck = document.getElementById('btnAllCheck');
            const btnReset = document.getElementById('btnReset');
            const btnExport = document.getElementById('btnExport');
            const btnReupload = document.getElementById('btnReupload');
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalClose = document.getElementById('modalClose');
            const btnCloseModal = document.getElementById('btnCloseModal');
            const resultSummary = document.getElementById('resultSummary');
            const resultList = document.getElementById('resultList');
            const btnCopyResult = document.getElementById('btnCopyResult');

            let toastTimer = null;

            // ========== 工具函数 ==========
            function showToast(message, type = 'success') {
                clearTimeout(toastTimer);
                toastMsg.textContent = message;
                toastIcon.textContent = type === 'success' ? '✅' : type === 'error' ? '❌' : '📋';
                toast.className = 'toast ' + type;
                // 触发重新渲染以重启动画
                void toast.offsetWidth;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2200);
            }

            function updateStats() {
                const total = studentList.length;
                const checked = studentList.filter(s => s.checked).length;
                const rate = total > 0 ? (checked / total * 100) : 0;

                totalCountEl.textContent = total;
                checkedCountEl.textContent = checked;
                rateDisplayEl.textContent = rate.toFixed(1) + '%';
                progressFill.style.width = rate + '%';
                progressText.textContent = checked + ' / ' + total;
            }

            function renderNames() {
                const grid = namesGrid;
                grid.innerHTML = '';
                const keyword = searchKeyword.trim().toLowerCase();

                let hasMatch = false;

                studentList.forEach((student, index) => {
                    const card = document.createElement('div');
                    card.className = 'name-card';
                    if (student.checked) card.classList.add('checked');
                    card.dataset.index = index;

                    // 搜索过滤
                    if (keyword) {
                        const nameLower = student.name.toLowerCase();
                        if (nameLower.includes(keyword)) {
                            card.classList.add('highlighted');
                            hasMatch = true;
                        } else {
                            card.classList.add('dimmed');
                        }
                    }

                    // 序号
                    const idxSpan = document.createElement('span');
                    idxSpan.className = 'name-index';
                    idxSpan.textContent = '#' + (index + 1);

                    // 名字
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'name-text';
                    nameSpan.textContent = student.name;

                    // 状态图标
                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'name-status-icon';
                    iconSpan.textContent = '✔';

                    card.appendChild(idxSpan);
                    card.appendChild(nameSpan);
                    card.appendChild(iconSpan);

                    // 点击事件
                    card.addEventListener('click', function(e) {
                        e.stopPropagation();
                        toggleCheck(index);
                    });

                    // 悬停提示
                    card.title = student.checked ? '点击取消签到' : '点击签到';

                    grid.appendChild(card);
                });

                // 如果搜索无结果
                if (keyword && !hasMatch && studentList.length > 0) {
                    const noResult = document.createElement('div');
                    noResult.className = 'no-result';
                    noResult.innerHTML = '<div class="no-result-icon">🔍</div>未找到匹配「' + escapeHtml(
                        searchKeyword) + '」的名字';
                    grid.appendChild(noResult);
                }
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function toggleCheck(index) {
                if (index < 0 || index >= studentList.length) return;
                const student = studentList[index];
                const card = namesGrid.querySelector(`.name-card[data-index="${index}"]`);
                const wasChecked = student.checked;

                // 更新状态
                student.checked = !student.checked;

                // 触发动画
                if (card) {
                    card.classList.remove('animating-check', 'animating-uncheck');
                    void card.offsetWidth; // 强制重排
                    if (student.checked) {
                        card.classList.add('animating-check');
                        card.classList.add('checked');
                        card.title = '点击取消签到';
                    } else {
                        card.classList.add('animating-uncheck');
                        card.classList.remove('checked');
                        card.title = '点击签到';
                    }
                    // 移除动画类
                    setTimeout(() => {
                        card.classList.remove('animating-check', 'animating-uncheck');
                    }, 500);
                }

                // 更新统计
                updateStats();

                // 显示提示
                if (student.checked) {
                    showToast('✅ ' + student.name + ' 已签到', 'success');
                } else {
                    showToast('↩️ ' + student.name + ' 已取消签到', 'error');
                }

                // 如果有搜索，重新渲染以保持高亮状态
                if (searchKeyword.trim()) {
                    renderNames();
                }
            }

            function resetAllChecks() {
                if (studentList.length === 0) return;
                if (!confirm('确定要清除所有签到记录吗？')) return;
                studentList.forEach(s => s.checked = false);
                renderNames();
                updateStats();
                showToast('🔄 已重置所有签到记录', 'success');
            }

            function checkAll() {
                if (studentList.length === 0) return;
                const allChecked = studentList.every(s => s.checked);
                if (allChecked) {
                    // 如果全部已签到，则全部取消
                    studentList.forEach(s => s.checked = false);
                    showToast('↩️ 已取消全部签到', 'error');
                } else {
                    studentList.forEach(s => s.checked = true);
                    showToast('✅ 已全部签到', 'success');
                }
                renderNames();
                updateStats();
            }

            function applySearch(keyword) {
                searchKeyword = keyword;
                if (keyword.trim()) {
                    searchClear.classList.add('visible');
                } else {
                    searchClear.classList.remove('visible');
                }
                renderNames();
            }

            function handleFile(file) {
                if (!file) return;
                const ext = file.name.split('.').pop().toLowerCase();
                if (ext !== 'xlsx' && ext !== 'xls') {
                    showToast('❌ 请上传Excel文件（.xlsx或.xls格式）', 'error');
                    return;
                }
                if (file.size > 20 * 1024 * 1024) {
                    showToast('❌ 文件过大，请上传小于20MB的文件', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheetName = workbook.SheetNames[0];
                        if (!sheetName) {
                            showToast('❌ 无法读取工作表', 'error');
                            return;
                        }
                        const sheet = workbook.Sheets[sheetName];
                        // 使用二维数组模式读取
                        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

                        if (!rows || rows.length === 0) {
                            showToast('❌ 表格为空，未找到数据', 'error');
                            return;
                        }

                        // 查找"姓名"列
                        const headerRow = rows[0] || [];
                        let nameColIndex = -1;
                        const nameKeywords = ['姓名', '名字', '学生姓名', '学员姓名', '姓 名', 'name', 'Name',
                            'NAME', '学生名字', '同学姓名'
                        ];

                        for (let i = 0; i < headerRow.length; i++) {
                            const cellStr = String(headerRow[i] || '').trim();
                            for (const kw of nameKeywords) {
                                if (cellStr === kw || cellStr.includes(kw)) {
                                    nameColIndex = i;
                                    break;
                                }
                            }
                            if (nameColIndex !== -1) break;
                        }

                        // 如果没找到，默认使用第一列
                        if (nameColIndex === -1) {
                            nameColIndex = 0;
                            // 尝试跳过明显的非姓名列
                            for (let i = 0; i < headerRow.length; i++) {
                                const cellStr = String(headerRow[i] || '').toLowerCase();
                                if (cellStr.includes('name') || cellStr.includes('姓名') || cellStr.includes(
                                        '名字')) {
                                    nameColIndex = i;
                                    break;
                                }
                            }
                        }

                        // 提取姓名
                        const names = [];
                        for (let i = 1; i < rows.length; i++) {
                            const cellVal = rows[i][nameColIndex];
                            const nameStr = String(cellVal || '').trim();
                            if (nameStr && nameStr !== '') {
                                names.push(nameStr);
                            }
                        }

                        if (names.length === 0) {
                            showToast('❌ 未找到有效的姓名数据', 'error');
                            return;
                        }

                        // 设置名单
                        studentList = names.map(name => ({ name: name, checked: false }));
                        fileName = file.name;

                        // 更新UI
                        uploadZone.classList.add('compact');
                        uploadZone.querySelector('.upload-text').textContent = '📄 ' + fileName;
                        uploadZone.querySelector('.upload-hint').textContent = '点击可更换文件';

                        // 显示统计和工具栏
                        statsSection.classList.add('visible');
                        toolbar.classList.add('visible');
                        namesSection.classList.add('visible');

                        // 渲染
                        searchInput.value = '';
                        searchKeyword = '';
                        searchClear.classList.remove('visible');
                        renderNames();
                        updateStats();

                        showToast('🎉 成功导入 ' + names.length + ' 个名字！', 'success');
                    } catch (err) {
                        console.error('解析Excel出错:', err);
                        showToast('❌ 解析文件失败，请检查文件格式', 'error');
                    }
                };
                reader.onerror = function() {
                    showToast('❌ 读取文件失败', 'error');
                };
                reader.readAsArrayBuffer(file);
            }

            function exportResult() {
                if (studentList.length === 0) return;
                const checked = studentList.filter(s => s.checked);
                const unchecked = studentList.filter(s => !s.checked);

                // 填充弹窗
                resultSummary.innerHTML = `
                    <span>✅ 已签到：${checked.length} 人</span>
                    <span>❌ 未签到：${unchecked.length} 人</span>
                    <span>📊 签到率：${(checked.length / studentList.length * 100).toFixed(1)}%</span>
                `;

                let listHtml = '';
                checked.forEach(s => {
                    listHtml += `<span class="tag checked-tag" title="点击取消签到">${escapeHtml(s.name)} ✔</span>`;
                });
                unchecked.forEach(s => {
                    listHtml += `<span class="tag unchecked-tag" title="点击标记签到">${escapeHtml(s.name)}</span>`;
                });
                resultList.innerHTML = listHtml || '<span style="color:#9ca3af;">暂无数据</span>';

                // 为标签添加点击事件
                resultList.querySelectorAll('.tag').forEach(tag => {
                    tag.addEventListener('click', function() {
                        const name = this.textContent.replace(' ✔', '').trim();
                        const idx = studentList.findIndex(s => s.name === name);
                        if (idx !== -1) {
                            toggleCheck(idx);
                            // 更新弹窗显示
                            setTimeout(() => exportResult(), 300);
                        }
                    });
                });

                modalOverlay.classList.add('visible');
            }

            function closeModal() {
                modalOverlay.classList.remove('visible');
            }

            function copyResult() {
                const checked = studentList.filter(s => s.checked).map(s => s.name);
                const unchecked = studentList.filter(s => !s.checked).map(s => s.name);
                const text =
                    `=== 签到结果 ===\n文件：${fileName}\n总人数：${studentList.length}\n已签到(${checked.length})：${checked.join('、')}\n未签到(${unchecked.length})：${unchecked.join('、')}\n签到率：${(checked.length / studentList.length * 100).toFixed(1)}%`;
                navigator.clipboard.writeText(text).then(() => {
                    showToast('📋 已复制到剪贴板', 'success');
                }).catch(() => {
                    // 降级方案
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('📋 已复制到剪贴板', 'success');
                });
            }

            function triggerReupload() {
                if (studentList.length > 0) {
                    if (!confirm('重新上传将清除当前名单和签到记录，确定继续吗？')) return;
                }
                // 重置状态
                studentList = [];
                fileName = '';
                searchKeyword = '';
                searchInput.value = '';
                searchClear.classList.remove('visible');

                uploadZone.classList.remove('compact');
                uploadZone.querySelector('.upload-text').textContent = '点击上传或拖拽Excel文件';
                uploadZone.querySelector('.upload-hint').textContent = '支持 .xlsx / .xls 格式，自动识别「姓名」列';

                statsSection.classList.remove('visible');
                toolbar.classList.remove('visible');
                namesSection.classList.remove('visible');
                namesGrid.innerHTML = '';

                fileInput.click();
            }

            // ========== 事件绑定 ==========
            // 上传区域点击
            uploadZone.addEventListener('click', function(e) {
                if (e.target === fileInput) return;
                if (studentList.length > 0) {
                    // 已有名单时点击上传区域也触发更换
                    triggerReupload();
                } else {
                    fileInput.click();
                }
            });

            fileInput.addEventListener('change', function(e) {
                if (e.target.files && e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
                fileInput.value = '';
            });

            // 拖拽支持
            uploadZone.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.stopPropagation();
                uploadZone.classList.add('dragover');
            });
            uploadZone.addEventListener('dragleave', function(e) {
                e.preventDefault();
                e.stopPropagation();
                uploadZone.classList.remove('dragover');
            });
            uploadZone.addEventListener('drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                uploadZone.classList.remove('dragover');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    if (studentList.length > 0 && !confirm('重新上传将覆盖当前名单，确定继续吗？')) return;
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            // 搜索
            searchInput.addEventListener('input', function() {
                applySearch(this.value);
            });
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    this.value = '';
                    applySearch('');
                    this.blur();
                }
            });
            searchClear.addEventListener('click', function() {
                searchInput.value = '';
                applySearch('');
                searchInput.focus();
            });

            // 按钮
            btnAllCheck.addEventListener('click', checkAll);
            btnReset.addEventListener('click', resetAllChecks);
            btnExport.addEventListener('click', exportResult);
            btnReupload.addEventListener('click', function() {
                triggerReupload();
            });

            // 弹窗
            modalClose.addEventListener('click', closeModal);
            btnCloseModal.addEventListener('click', closeModal);
            btnCopyResult.addEventListener('click', copyResult);
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) closeModal();
            });

            // 键盘快捷键
            document.addEventListener('keydown', function(e) {
                // Ctrl+F 聚焦搜索
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                    if (studentList.length > 0) {
                        e.preventDefault();
                        searchInput.focus();
                        searchInput.select();
                    }
                }
                // Ctrl+A 全选/取消全选签到
                if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
                    if (studentList.length > 0 && !searchInput.matches(':focus')) {
                        e.preventDefault();
                        checkAll();
                    }
                }
                // Escape 关闭弹窗
                if (e.key === 'Escape') {
                    if (modalOverlay.classList.contains('visible')) {
                        closeModal();
                    }
                }
            });

            // 初始化
            updateStats();
        })();
    </script>
</body>
</html>
